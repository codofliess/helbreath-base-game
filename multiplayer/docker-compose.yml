services:
  postgres:
    image: postgres:16-alpine
    container_name: helbreath-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: helbreath
      POSTGRES_PASSWORD: helbreath
      POSTGRES_DB: helbreath
    volumes:
      - helbreath_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helbreath -d helbreath"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  helbreath_pg_data:
