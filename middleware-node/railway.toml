# Chain Lords middleware (auth, market side door, hell, tournaments)
[build]
builder = "NIXPACKS"

[deploy]
startCommand = "node server.js"
preDeployCommand = "node scripts/apply-schema.js"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
