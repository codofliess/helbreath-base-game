name: tables-diff

on:
  pull_request:
  workflow_dispatch:

jobs:
  tables-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tables diff unit tests
        run: node --test tools/tables-diff.test.mjs
      - name: Diff server tables against Olympia cfg
        run: node tools/tables-diff.mjs --out /tmp/tables-diff
