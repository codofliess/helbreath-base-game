syntax = "proto3";

package mmorpg.network;

enum MonsterEntityState {
  MONSTER_ENTITY_STATE_IDLE = 0;
  MONSTER_ENTITY_STATE_MOVE = 1;
  MONSTER_ENTITY_STATE_ATTACK = 2;
}

enum GroundEffectType {
  GROUND_EFFECT_TYPE_FIRE = 0;
  GROUND_EFFECT_TYPE_POISON = 1;
  GROUND_EFFECT_TYPE_SPIKE_FIELD = 2;
  GROUND_EFFECT_TYPE_ICE_STORM = 3;
}

enum TemporaryEffectType {
  TEMPORARY_EFFECT_TYPE_INVISIBILITY = 0;
  TEMPORARY_EFFECT_TYPE_CHILL = 1;
  TEMPORARY_EFFECT_TYPE_BERSERK = 2;
  // Olympia HOLDOBJECT (Hold Person / Paralyze): blocks movement; monsters also skip attack AI.
  TEMPORARY_EFFECT_TYPE_PARALYZE = 3;
  // Olympia MAGICTYPE_POISON status DoT (Poison / Mass Poison); Cure removes.
  TEMPORARY_EFFECT_TYPE_POISON = 4;
  // Olympia MAGICTYPE_CONFUSE value 1 — Confuse Language (chat garble).
  TEMPORARY_EFFECT_TYPE_CONFUSE_LANGUAGE = 5;
  // Olympia MAGICTYPE_CONFUSE value 2 — Confusion / Mass Confusion.
  TEMPORARY_EFFECT_TYPE_CONFUSION = 6;
  // Olympia MAGICTYPE_CONFUSE value 3 — Illusion / Mass Illusion.
  TEMPORARY_EFFECT_TYPE_ILLUSION = 7;
  // Olympia MAGICTYPE_CONFUSE value 4 — Illusion Movement (when typed as CONFUSE).
  TEMPORARY_EFFECT_TYPE_ILLUSION_MOVEMENT = 8;
  // Olympia MAGICTYPE_INHIBITION — blocks spell casting.
  TEMPORARY_EFFECT_TYPE_INHIBITION = 9;
  // Olympia MAGICTYPE_PROTECT value 1 — Protection From Arrow.
  TEMPORARY_EFFECT_TYPE_PROTECT_FROM_ARROW = 10;
  // Olympia MAGICTYPE_PROTECT value 2 — Protection From Magic.
  TEMPORARY_EFFECT_TYPE_PROTECT_FROM_MAGIC = 11;
  // Olympia MAGICTYPE_PROTECT value 3 — Defense Shield.
  TEMPORARY_EFFECT_TYPE_DEFENSE_SHIELD = 12;
  // Olympia MAGICTYPE_PROTECT value 4 — Great Defense Shield.
  TEMPORARY_EFFECT_TYPE_GREAT_DEFENSE_SHIELD = 13;
  // Olympia MAGICTYPE_PROTECT value 5 — Absolute Magic Protection.
  TEMPORARY_EFFECT_TYPE_ABSOLUTE_MAGIC_PROTECT = 14;
  // Olympia Haste — run speed only; allies of same city (never self).
  TEMPORARY_EFFECT_TYPE_HASTE = 15;
  // Sleep (Nemesis / Helbreath Cursed lineage): blocks action; first damaging hit wakes with +100% damage.
  // Multi-hit spells (Blizzard etc.) also gain +1 guaranteed hit that ignores MR.
  TEMPORARY_EFFECT_TYPE_SLEEP = 16;
  // Cash-shop Exp Tablet: +200% EXP; underfoot aura only (no movement change).
  TEMPORARY_EFFECT_TYPE_EXP_BOOST = 17;
}

enum TemporaryEffectEntityKind {
  TEMPORARY_EFFECT_ENTITY_KIND_PLAYER = 0;
  TEMPORARY_EFFECT_ENTITY_KIND_MONSTER = 1;
}

// Matches client Gender / server persistence: 0 = male, 1 = female.
enum PlayerGender {
  PLAYER_GENDER_MALE = 0;
  PLAYER_GENDER_FEMALE = 1;
}

// Matches client SkinColor / server persistence: 0 = light, 1 = tanned, 2 = dark.
enum PlayerSkinColor {
  PLAYER_SKIN_COLOR_LIGHT = 0;
  PLAYER_SKIN_COLOR_TANNED = 1;
  PLAYER_SKIN_COLOR_DARK = 2;
}

// Matches client MapDialog / WeatherManager string modes (dry, rain-*, snow-*).
enum WeatherMode {
  WEATHER_MODE_DRY = 0;
  WEATHER_MODE_RAIN_LIGHT = 1;
  WEATHER_MODE_RAIN_MEDIUM = 2;
  WEATHER_MODE_RAIN_HEAVY = 3;
  WEATHER_MODE_SNOW_LIGHT = 4;
  WEATHER_MODE_SNOW_MEDIUM = 5;
  WEATHER_MODE_SNOW_HEAVY = 6;
}

// Olympia chat log tabs (DrawDialogBox chat). Client filters; whisper is routed privately.
enum ChatChannel {
  CHAT_CHANNEL_GLOBAL = 0;
  CHAT_CHANNEL_TRADE = 1;
  CHAT_CHANNEL_TOWN = 2;
  CHAT_CHANNEL_NEARBY = 3;
  CHAT_CHANNEL_GUILD = 4;
  CHAT_CHANNEL_PARTY = 5;
  CHAT_CHANNEL_WHISPER = 6;
  CHAT_CHANNEL_MISC = 7;
}

message ClientMessage {
  oneof payload {
    PingRequest ping_request = 1;
    RequestMovement request_movement = 2;
    MakeServerCellOccupiedRequest make_server_cell_occupied_request = 3;
    ChangePlayerMovementSpeedRequest change_player_movement_speed_request = 4;
    PlayerMovementStateChangeRequest player_movement_state_change_request = 5;
    AuthenticateRequest authenticate_request = 6;
    LogoutRequest logout_request = 7;
    LogoutCancelledRequest logout_cancelled_request = 8;
    WorldChangeRequest world_change_request = 9;
    PlayerAttackModeChangeRequest player_attack_mode_change_request = 10;
    ChangePlayerIdleDirectionRequest change_player_idle_direction_request = 11;
    SummonMonsterRequested summon_monster_requested = 12;
    PlayerAttackedMonsterRequest player_attacked_monster_request = 13;
    PlayerResurrectedRequest player_resurrected_request = 14;
    PlayerPickupRequested player_pickup_requested = 15;
    PlayerBowStanceRequested player_bow_stance_requested = 16;
    PlayerAttackedPlayerRequest player_attacked_player_request = 17;
    ChangePlayerAttackStunDurationRequest change_player_attack_stun_duration_request = 18;
    ChangePlayerAttackSpeedRequest change_player_attack_speed_request = 19;
    ChangePlayerAttackRangeRequest change_player_attack_range_request = 20;
    ChangePlayerAttackDamageRequest change_player_attack_damage_request = 21;
    KillAllMonstersRequested kill_all_monsters_requested = 22;
    PlayerTeleportRequested player_teleport_requested = 23;
    SpellCastStartRequest spell_cast_start_request = 24;
    SpellCastCancelRequest spell_cast_cancel_request = 25;
    SpellCastRequest spell_cast_request = 26;
    ChangePlayerCastSpeedRequest change_player_cast_speed_request = 27;
    ChangePlayerAttackTypeRequest change_player_attack_type_request = 28;
    ChangePlayerAllowDashAttackRequest change_player_allow_dash_attack_request = 29;
    CreateItemRequest create_item_request = 30;
    MoveItemInBagRequest move_item_in_bag_request = 31;
    EquipItemRequest equip_item_request = 32;
    UnequipItemRequest unequip_item_request = 33;
    ConsumeItemRequest consume_item_request = 34;
    ChangePlayerAppearanceRequest change_player_appearance_request = 35;
    PlayerItemDropRequested player_item_drop_requested = 36;
    PlayerItemPickupRequested player_item_pickup_requested = 37;
    ChatMessageSendRequest chat_message_send_request = 38;
    WeatherChangeRequest weather_change_request = 39;
    SummonNpcRequest summon_npc_request = 40;
    KillAllNpcsRequest kill_all_npcs_request = 41;
    ClaimKillMilestoneRequest claim_kill_milestone_request = 42;
    RebirthRequest rebirth_request = 43;
    // Cancel last rebirth → L max of previous RB (snapshot). Field 103 (92+ taken by arena pact).
    RebirthRollbackRequest rebirth_rollback_request = 103;
    // Pre-world: list up to 4 character slots for a wallet after Phantom auth (SELECTCHAR desk).
    CharacterListRequest character_list_request = 44;
    // Buy a consumable (or listed shop item) from a nearby Shop Keeper NPC.
    BuyShopItemRequest buy_shop_item_request = 45;
    // Optional beginner path 1→80: enroll / re-enroll (no penalty to abandon).
    BeginnerPathEnrollRequest beginner_path_enroll_request = 46;
    BeginnerPathAbandonRequest beginner_path_abandon_request = 47;
    // Talk to a beginner-path NPC (Enzu / Drillmaster / Merc Captain) for talk objectives.
    BeginnerPathTalkRequest beginner_path_talk_request = 48;
    // Training Arena: apply a chase-dummy preset (world `training` only).
    ApplyTrainingPresetRequest apply_training_preset_request = 49;
    // Soft UI objectives (open Party/Guild, read EK hint, select Training Arena preset).
    BeginnerPathUiActionRequest beginner_path_ui_action_request = 50;
    // William warehouse: open snapshot / deposit bag stack / withdraw warehouse stack (proximity-checked).
    OpenWarehouseRequest open_warehouse_request = 51;
    WarehouseDepositRequest warehouse_deposit_request = 52;
    WarehouseWithdrawRequest warehouse_withdraw_request = 53;
    // Tom blacksmith: repair a bag/equipped weapon (Olympia durability).
    RepairItemRequest repair_item_request = 54;
    // Minimal party MVP: create / join by code / leave (Beginner Path + F5 Party).
    CreatePartyRequest create_party_request = 55;
    JoinPartyRequest join_party_request = 56;
    LeavePartyRequest leave_party_request = 57;
    // City NPC desk (Howard / Kennedy / Gail / Perry) — proximity-checked actions.
    CityNpcServiceRequest city_npc_service_request = 58;
    // GM ops: read / mutate anti-bot tool flags (rejected for traveler sessions).
    GetAntiBotToolsRequest get_anti_bot_tools_request = 59;
    SetAntiBotToolsRequest set_anti_bot_tools_request = 60;
    // Timed Challenges Mode 1 (Skills): start / abort / daily leaderboard.
    StartTimedChallengeRequest start_timed_challenge_request = 61;
    AbortTimedChallengeRequest abort_timed_challenge_request = 62;
    GetTimedChallengeLeaderboardRequest get_timed_challenge_leaderboard_request = 63;
    // Trade / auction board MVP (timed bid + limit sell, access rules, 5% fee debt).
    AuctionBoardBrowseRequest auction_board_browse_request = 64;
    AuctionBoardCreateRequest auction_board_create_request = 65;
    AuctionBoardBidRequest auction_board_bid_request = 66;
    AuctionBoardBuyRequest auction_board_buy_request = 67;
    AuctionBoardCancelRequest auction_board_cancel_request = 68;
    AuctionBoardSettleDebtRequest auction_board_settle_debt_request = 69;
    // Item Drops tab: sell a bag item for gold (Olympia list-price / 2).
    SellBagItemRequest sell_bag_item_request = 70;
    // F5 Level Set: spend unspent LU points into STR/VIT/DEX/INT/MAG/CHR (Olympia MSGID_LEVELUPSETTINGS).
    LevelUpSettingsRequest level_up_settings_request = 71;
    // Olympia Home / DEF_COMMONTYPE_TOGGLESAFEATTACKMODE — blocks non-enemy PvP hits while armed.
    PlayerSafeAttackModeChangeRequest player_safe_attack_mode_change_request = 72;
    // Play-mine $HELL: status / claim pending balance (C1 · off-chain credits until mint).
    HellMiningStatusRequest hell_mining_status_request = 73;
    HellMiningClaimRequest hell_mining_claim_request = 74;
    // Olympia majestic / gizon upgrade for Angelic pendants and Dark Knight weapons.
    MajesticUpgradeRequest majestic_upgrade_request = 75;
    // Soul / Guild / Unbind seals (~USD 5): bind_state on item instance.
    ItemBindRequest item_bind_request = 76;
    // Cashier cash shop (stablecoin USDC/USDT or pending $HELL).
    BuyCashShopItemRequest buy_cash_shop_item_request = 77;
    // Pre-world: check if a display name is free before Create Character confirms.
    CharacterNameCheckRequest character_name_check_request = 78;
    // Chain Lords: freeze level (exp → majestic) or unfreeze (exp → levels again).
    SetLevelBlockRequest set_level_block_request = 79;
    // Xelima / Merien stone upgrade (Olympia + CL fail rules). Optional Integrity anti-burn.
    StoneItemUpgradeRequest stone_item_upgrade_request = 80;
    // Mining (0) / Fishing (1) gather attempt (rod near water / pickaxe near node).
    SkillGatherRequest skill_gather_request = 81;
    // Snapshot skill masteries (0–100) for F8 Skill dialog.
    GetSkillsStateRequest get_skills_state_request = 82;
    // Olympia disenchant / enchant / combine shards+fragments (armor specs).
    ItemDisenchantRequest item_disenchant_request = 83;
    ItemEnchantRequest item_enchant_request = 84;
    EnchantMaterialUpgradeRequest enchant_material_upgrade_request = 85;
    GetEnchantMaterialsRequest get_enchant_materials_request = 86;
    // Olympia MSGID_STATECHANGEPOINT: spend 1 majestic to drop 3 stat points (respec sink).
    MajesticStatRespecRequest majestic_stat_respec_request = 87;
    // Merge 2 same-CIC same-stat-kind gear → next CIC (min HP/SP/MP value).
    CicItemMergeRequest cic_item_merge_request = 88;
    // Upgrade Mana/HP Siphon gem by spending matching siphon shards.
    SiphonGemUpgradeRequest siphon_gem_upgrade_request = 89;
    // Olympia DEF_COMMONTYPE_REQUEST_ACTIVATESPECABLTY — Page Up activates Merien/Xelima SA.
    ActivateSpecialAbilityRequest activate_special_ability_request = 90;
    // Arm/disarm Super Attack (crit) — charges only spent while armed.
    SetSuperAttackArmedRequest set_super_attack_armed_request = 91;
    // Arena pact duel: create / invite / ready / cancel / list open invites.
    ArenaPactCreateRequest arena_pact_create_request = 92;
    ArenaPactInviteRequest arena_pact_invite_request = 93;
    ArenaPactRespondRequest arena_pact_respond_request = 94;
    ArenaPactReadyRequest arena_pact_ready_request = 95;
    ArenaPactCancelRequest arena_pact_cancel_request = 96;
    ArenaPactListRequest arena_pact_list_request = 97;
    // Pre-countdown: captains propose / accept tech equalization.
    ArenaPactTechProposeRequest arena_pact_tech_propose_request = 98;
    ArenaPactTechVoteRequest arena_pact_tech_vote_request = 99;
    // During tech_sample on map: continuous self-report until photo freezes.
    ArenaPactTechReportRequest arena_pact_tech_report_request = 100;
    // Fighter or host sets/updates POV or global stream URL for Watch multi-cam.
    ArenaPactSetStreamRequest arena_pact_set_stream_request = 101;
    // World / tournament Go-Live on public cartelera (not a pact duel).
    StreamBroadcastRequest stream_broadcast_request = 102;
    // (103 = rebirth_rollback_request, declared near rebirth_request)
    // Arena prize bag (captain pledges / re-OK / signed loss).
    ArenaPactPrizePledgeRequest arena_pact_prize_pledge_request = 104;
    ArenaPactPrizeConfirmRequest arena_pact_prize_confirm_request = 105;
    ArenaPactSignLossRequest arena_pact_sign_loss_request = 106;
  }
}

// Attach / update a live stream for cartelera multi-cam (Twitch, YouTube, Discord Go Live link).
message ArenaPactSetStreamRequest {
  string match_id = 1;
  // Full URL (https://twitch.tv/…, youtube, discord.gg/…, etc.).
  string stream_url = 2;
  // Host only: when true, sets match-level global cam (not personal POV).
  bool is_global = 3;
}

// Announce or stop a public stream on the global cartelera (World hunt / raid / tournament desk).
message StreamBroadcastRequest {
  // world | tournament | other
  string kind = 1;
  string title = 2;
  string stream_url = 3;
  // false = remove from cartelera
  bool active = 4;
}

message StreamBroadcastState {
  string broadcast_id = 1;
  string kind = 2;
  string title = 3;
  string character_name = 4;
  string stream_url = 5;
  string stream_platform = 6;
  string world_id = 7;
  int64 started_at_ms = 8;
  int64 expires_at_ms = 9;
  bool active = 10;
}

// Two bag item UIDs (same base id for shields; same cic level + cic_stat_kind for all).
message CicItemMergeRequest {
  int64 item_uid_a = 1;
  int64 item_uid_b = 2;
}

// Spend siphon shards of current gem level to raise siphon_level +1.
message SiphonGemUpgradeRequest {
  int64 item_uid = 1;
}

// Empty: activate equipped Merien/Xelima special ability (cooldown-gated).
message ActivateSpecialAbilityRequest {}

// When armed=true and SuperAttackLeft>0, melee crits consume charges until disarmed or empty.
message SetSuperAttackArmedRequest {
  bool armed = 1;
}

// Special ability lifecycle (Olympia sV1 status codes).
// status: 1=activated, 2=set on equip, 3=expired, 4=released, 5=cooldown ready
message SpecialAbilityStatus {
  int32 status = 1;
  int32 ability_type = 2;
  // Activated: remaining active seconds. Equip/ready: cooldown remaining seconds.
  int32 duration_or_cooldown_sec = 3;
  // When status=1 (activated), nearby clients can play VFX on this player.
  int64 player_id = 4;
}

// Break magic item → shards (primary) + fragments (secondary); item destroyed.
message ItemDisenchantRequest {
  int64 item_uid = 1;
}

// kind: 0 = apply matching shard (primary +1), 1 = apply matching fragment (secondary +1).
message ItemEnchantRequest {
  int64 item_uid = 1;
  int32 kind = 2;
}

// Combine materials: kind 0 shard / 1 fragment; mode 0 one / 2 all-shard / 1 one-frag / 3 all-frag.
// level = current material level (1-based); crafts level+1.
message EnchantMaterialUpgradeRequest {
  int32 kind = 1;
  int32 type = 2;
  int32 level = 3;
  int32 mode = 4;
}

message GetEnchantMaterialsRequest {}

// stat_a/b/c: 0=Str 1=Vit 2=Dex 3=Int 4=Mag 5=Chr — three points removed (1 majestic).
message MajesticStatRespecRequest {
  int32 stat_a = 1;
  int32 stat_b = 2;
  int32 stat_c = 3;
}

// skill_id: 0 = Mining, 1 = Fishing (Olympia SKILLCFG order).
message SkillGatherRequest {
  int32 skill_id = 1;
}

message GetSkillsStateRequest {}

// Upgrade bag/equipped weapon (Xelima) or armor/shield (Merien). Optionally spend Integrity to prevent burn past +7.
message StoneItemUpgradeRequest {
  int64 item_uid = 1;
  // When true, consume Stone of Integrity (1112) on fail in the burn zone (+7 and up) instead of destroying the item.
  bool use_integrity_stone = 2;
}

// Toggle Block Level: while blocked, kill exp converts to majestic points instead of levels.
message SetLevelBlockRequest {
  bool blocked = 1;
}

// Spend majestic (gizon) points to upgrade a bag item (angels / DK weapons).
message MajesticUpgradeRequest {
  int64 item_uid = 1;
}

// Client confirms Level Set allocations (deltas spent from current LU pool).
message LevelUpSettingsRequest {
  int32 str = 1;
  int32 vit = 2;
  int32 dex = 3;
  int32 intel = 4;
  int32 mag = 5;
  int32 chr = 6;
}

// Client asks to start a timed challenge run (Mode 1 Skills CC / Mode 2–3 PVP Skills).
message StartTimedChallengeRequest {
  string game_world_id = 1;
  // 1 = Skills CC protocol, 2 = PVP Guards (wave kills), 3 = PVP Dark Elves (invis pot + PFA then wave kills).
  int32 mode = 2;
}

// Client aborts the active timed challenge (no reward / no board entry).
message AbortTimedChallengeRequest {
  string game_world_id = 1;
}

// Client asks for today's Mode leaderboard (best times).
message GetTimedChallengeLeaderboardRequest {
  int32 mode = 1;
}

// --- Trade / auction board MVP (C6 · ~5% fee · server-authoritative gold for now) ---

enum AuctionListingMode {
  AUCTION_LISTING_MODE_UNSPECIFIED = 0;
  // Timed bidding until expires_at_ms; highest bid wins.
  AUCTION_LISTING_MODE_TIME = 1;
  // Limit sell: settles when a buyer pays list_price_gold (buy-at-list).
  AUCTION_LISTING_MODE_LIMIT = 2;
}

// Per-listing seller access controls (deny rules + optional gates; combinable).
message AuctionAccessRules {
  bool only_own_city = 1;
  bool only_own_guild = 2;
  repeated string blocked_guild_ids = 3;
  repeated string blocked_player_names = 4;
  // Anti-alt: buyer must be full level (server threshold) and reputation >= 100.
  bool require_full_level_and_rep100 = 5;
}

message AuctionListing {
  string listing_id = 1;
  string seller_wallet = 2;
  string seller_name = 3;
  string seller_city = 4;
  string seller_guild_id = 5;
  AuctionListingMode mode = 6;
  int32 item_id = 7;
  int64 item_uid = 8;
  int32 quantity = 9;
  uint32 item_attribute = 10;
  int32 item_color = 11;
  int32 cur_life_span = 12;
  int32 max_life_span = 13;
  // Limit buy-now / list price (gold). Also used as reserve context for timed auctions.
  int32 list_price_gold = 14;
  int32 min_bid_gold = 15;
  int32 current_bid_gold = 16;
  string current_bidder_name = 17;
  int64 created_at_ms = 18;
  int64 expires_at_ms = 19;
  AuctionAccessRules access = 20;
  // active | sold | expired | cancelled
  string status = 21;
  string item_name = 22;
}

message AuctionBoardBrowseRequest {
  string game_world_id = 1;
}

message AuctionBoardCreateRequest {
  string game_world_id = 1;
  int64 item_uid = 2;
  AuctionListingMode mode = 3;
  int32 list_price_gold = 4;
  int32 min_bid_gold = 5;
  // Timed auction duration; clamped server-side (1–168 hours). Ignored for limit sells (use default shelf life).
  int32 duration_hours = 6;
  AuctionAccessRules access = 7;
}

message AuctionBoardBidRequest {
  string game_world_id = 1;
  string listing_id = 2;
  int32 bid_gold = 3;
}

message AuctionBoardBuyRequest {
  string game_world_id = 1;
  string listing_id = 2;
}

message AuctionBoardCancelRequest {
  string game_world_id = 1;
  string listing_id = 2;
}

message AuctionBoardSettleDebtRequest {
  string game_world_id = 1;
}

message AuctionBoardSnapshot {
  repeated AuctionListing listings = 1;
  string message = 2;
  int32 my_debt_gold = 3;
  int64 my_debt_due_ms = 4;
  bool my_trade_blocked = 5;
  // Mock vs real: MVP settles gold in bag (item 90); on-chain $HELL wallet not wired.
  string settlement_note = 6;
}

message AuctionBoardActionResult {
  bool ok = 1;
  string message = 2;
  optional AuctionListing listing = 3;
  int32 my_debt_gold = 4;
  int64 my_debt_due_ms = 5;
  bool my_trade_blocked = 6;
}

// --- Play-mine $HELL (C1 · server-authoritative credits → pending; claim when mint exists) ---

message HellMiningStatusRequest {
  string game_world_id = 1;
}

// amount 0 = claim all pending. Without HELL_MINT env, server refuses and keeps pending.
message HellMiningClaimRequest {
  string game_world_id = 1;
  int64 amount = 2;
}

message HellMiningStatus {
  int64 pending_hell = 1;
  int64 claimed_hell = 2;
  int64 remaining_pool = 3;
  string utc_day = 4;
  int32 today_credits = 5;
  int32 today_monster_kills = 6;
  bool today_monster_credit_granted = 7;
  int64 today_direct_tokens = 8;
  bool today_settled = 9;
  bool claim_available = 10;
  // Utility/mining copy only — never salary/APY/ROI.
  string note = 11;
}

message HellMiningClaimResult {
  bool ok = 1;
  string message = 2;
  int64 pending_hell = 3;
  int64 claimed_amount = 4;
}

// Client asks the training arena world to spawn War/Mage chase dummies for a preset id.
message ApplyTrainingPresetRequest {
  string preset_id = 1;
  string game_world_id = 2;
}

// Start or resume the optional beginner training path.
message BeginnerPathEnrollRequest {
}

// Leave the beginner path with no gameplay penalty (XP/worlds/items unaffected).
message BeginnerPathAbandonRequest {
}

// Credit a talk objective when interacting with a farm training NPC.
message BeginnerPathTalkRequest {
  int32 catalog_npc_id = 1;
}

// Credit a soft UI objective (action_id must match BeginnerPath.json uiActionId).
message BeginnerPathUiActionRequest {
  string action_id = 1;
}

// Client asks Tom to repair one weapon by item uid (bag or equipped).
message RepairItemRequest {
  string game_world_id = 1;
  int64 npc_id = 2;
  int64 item_uid = 3;
}

// Sell one bag stack for gold (Item Drops / bag quick-sell). Uses Olympia NPC buy-back ≈ list price / 2.
message SellBagItemRequest {
  string game_world_id = 1;
  int64 item_uid = 2;
}

message SellBagItemResult {
  bool ok = 1;
  string message = 2;
  optional int32 gold_gained = 3;
  optional int64 item_uid = 4;
}

// City NPC desk action (Howard guild registry, Kennedy city hall, Gail cathedral, Perry command).
// action: open | register_guild_interest | city_brief | heal | bless | donate | crusade_brief
message CityNpcServiceRequest {
  string game_world_id = 1;
  int64 npc_id = 2;
  string action = 3;
  // Gold amount for donate (ignored for other actions).
  optional int32 donate_gold = 4;
}

// Authoritative reply for city NPC desk UIs (status + role-specific snapshot fields).
message CityNpcServiceResult {
  bool ok = 1;
  string message = 2;
  string role = 3;
  string npc_name = 4;
  bool guild_interest_registered = 5;
  string citizenship_side = 6;
  string city_services_summary = 7;
  int32 hp = 8;
  int32 max_hp = 9;
  int32 gold_spent = 10;
  string crusade_status = 11;
  bool blessed = 12;
}

// Client buys quantity of an item from a shop NPC (validated server-side: proximity + catalog; grants one stack/request).
message BuyShopItemRequest {
  string game_world_id = 1;
  int64 npc_id = 2;
  int32 item_id = 3;
  // Units to purchase in this request (server clamps to 1..50).
  int32 quantity = 4;
}

// Claim a completed kill/rebirth milestone reward, choosing one item from the milestone's reward list.
message ClaimKillMilestoneRequest {
  string milestone_id = 1;
  int32 chosen_item_id = 2;
}

// Request a rebirth: requires max level; resets exp/level and increments rebirth count.
message RebirthRequest {
}

// Undo last rebirth: restore pre-rebirth snapshot (L max of previous RB + stats/maj); progress kept via snapshot.
message RebirthRollbackRequest {
}

message WeatherChangeRequest {
  WeatherMode weather = 1;
}

message WeatherChanged {
  WeatherMode weather = 1;
}

message CreateItemRequest {
  int32 item_id = 1;
