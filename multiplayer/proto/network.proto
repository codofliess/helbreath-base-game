  repeated ItemEffectEntry effect_overrides = 6;
  optional int32 bag_z_index = 7;
  optional uint32 item_attribute = 8;
  optional int32 item_color = 9;
  optional int32 cur_life_span = 10;
  optional int32 max_life_span = 11;
  // 0=unbound, 1=soulbound, 2=guildbound.
  optional int32 bind_state = 12;
  optional string bound_guild_id = 13;
